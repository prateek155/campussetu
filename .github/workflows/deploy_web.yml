name: Build and Deploy Web Portals

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env
        run: |
          echo "API_BASE_URL=https://campussetu1-production.up.railway.app/api/v1" > .env
          echo "API_HEALTH_URL=https://campussetu1-production.up.railway.app/health" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build User Web
        run: |
          flutter build web -t lib/main_user.dart
          mkdir -p build/web_user
          cp -r build/web/* build/web_user/
          echo "/* /index.html 200" > build/web_user/_redirects

      - name: Build Admin Web
        run: |
          flutter build web -t lib/main_admin.dart
          mkdir -p build/web_admin
          cp -r build/web/* build/web_admin/
          echo "/* /index.html 200" > build/web_admin/_redirects

      - name: Build Enterprise Web
        run: |
          flutter build web -t lib/main_enterprise.dart
          mkdir -p build/web_enterprise
          cp -r build/web/* build/web_enterprise/
          echo "/* /index.html 200" > build/web_enterprise/_redirects

      - name: Build Faculty Web
        run: |
          flutter build web -t lib/main_faculty.dart
          mkdir -p build/web_faculty
          cp -r build/web/* build/web_faculty/
          echo "/* /index.html 200" > build/web_faculty/_redirects

      - name: Deploy All 4 Portals to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler pages project create campussetu-user --production-branch main || true
          npx --yes wrangler pages deploy build/web_user --project-name campussetu-user --commit-dirty=true

          npx --yes wrangler pages project create campussetu-admin --production-branch main || true
          npx --yes wrangler pages deploy build/web_admin --project-name campussetu-admin --commit-dirty=true

          npx --yes wrangler pages project create campussetu-enterprise --production-branch main || true
          npx --yes wrangler pages deploy build/web_enterprise --project-name campussetu-enterprise --commit-dirty=true

          npx --yes wrangler pages project create campussetu-faculty --production-branch main || true
          npx --yes wrangler pages deploy build/web_faculty --project-name campussetu-faculty --commit-dirty=true
