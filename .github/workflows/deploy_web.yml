name: Build and Deploy Web Portals

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env
        run: |
          echo "API_BASE_URL=https://campussetu1-production.up.railway.app/api/v1" > .env
          echo "API_HEALTH_URL=https://campussetu1-production.up.railway.app/health" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build User Web
        run: |
          flutter build web -t lib/main_user.dart
          mkdir -p build/web_user
          cp -r build/web/* build/web_user/
          echo "/* /index.html 200" > build/web_user/_redirects

      - name: Build Admin Web
        run: |
          flutter build web -t lib/main_admin.dart
          mkdir -p build/web_admin
          cp -r build/web/* build/web_admin/
          echo "/* /index.html 200" > build/web_admin/_redirects

      - name: Build Enterprise Web
        run: |
          flutter build web -t lib/main_enterprise.dart
          mkdir -p build/web_enterprise
          cp -r build/web/* build/web_enterprise/
          echo "/* /index.html 200" > build/web_enterprise/_redirects

      - name: Build Faculty Web
        run: |
          flutter build web -t lib/main_faculty.dart
          mkdir -p build/web_faculty
          cp -r build/web/* build/web_faculty/
          echo "/* /index.html 200" > build/web_faculty/_redirects

      - name: Deploy User Web to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: campussetu-user
          directory: build/web_user

      - name: Deploy Admin Web to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: campussetu-admin
          directory: build/web_admin

      - name: Deploy Enterprise Web to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: campussetu-enterprise
          directory: build/web_enterprise

      - name: Deploy Faculty Web to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: campussetu-faculty
          directory: build/web_faculty
