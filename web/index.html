<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="campussetu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>campussetu</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- OCR runtime, model, and WebAssembly core are bundled locally. -->
  <script src="ocr/assets/tesseract.min.js"></script>
  <script>
    let campusSetuOcrWorker;

    async function getCampusSetuOcrWorker() {
      if (!window.Tesseract) throw new Error('Local OCR runtime is unavailable');
      if (!campusSetuOcrWorker) {
        const assets = new URL('ocr/assets/', document.baseURI);
        campusSetuOcrWorker = window.Tesseract.createWorker('eng', 1, {
          workerPath: new URL('worker.min.js', assets).toString(),
          workerBlobURL: false,
          langPath: new URL('lang', assets).toString(),
          corePath: new URL('tesseract-core-lstm.wasm.js', assets).toString(),
        }).catch((error) => {
          campusSetuOcrWorker = null;
          throw error;
        });
      }
      return campusSetuOcrWorker;
    }

    window.addEventListener('campussetu_ocr_request', async function(e) {
      try {
        const worker = await getCampusSetuOcrWorker();
        const res = await worker.recognize(e.detail);
        const text = (res && res.data && res.data.text) ? res.data.text.trim() : '';
        window.dispatchEvent(new CustomEvent('campussetu_ocr_response', { detail: text }));
      } catch (err) {
        window.dispatchEvent(new CustomEvent('campussetu_ocr_response', { detail: 'ERROR: ' + err }));
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
