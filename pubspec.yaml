name: campussetu
description: CampusSetu — All-India University Student Platform
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.3.0

  # Networking
  dio: ^5.7.0
  retrofit: ^4.3.0

  # Fonts
  google_fonts: ^6.2.1

  # UI / Media
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  lottie: ^3.1.2
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  dotted_border: ^2.1.0
  smooth_page_indicator: ^1.2.0+3
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.70.2

  # PDF / Resume
  pdf: ^3.11.1
  printing: ^5.13.1

  # Storage / Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  timeago: ^3.7.0
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  in_app_update: ^4.2.3
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E9EBEE"
  adaptive_icon_foreground: "assets/images/app_icon.png"